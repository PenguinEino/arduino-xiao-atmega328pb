name: Install and compile package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.4.1'
      - run: python3 scripts/smoke_test.py
